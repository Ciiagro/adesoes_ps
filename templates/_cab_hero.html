{# Cabeçalho padrão das telas de Sindicatos: folha, título forte e paisagem à direita. #}
{% macro cab_hero(titulo, sub='', extra_class='') -%}
<div class="cab-hero {{ extra_class }}">
  <svg class="cab-folha" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="cabg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0F6B2E"/><stop offset="1" stop-color="#7BC043"/></linearGradient></defs><path d="M8 56C6 30 22 10 56 6c2 32-14 50-40 52" fill="url(#cabg)"/><path d="M10 54C22 38 34 26 50 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".85"/><path d="M8 58c2-6 4-9 8-12" stroke="#0F6B2E" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
  <div class="cab-txt"><h1>{{ titulo }}</h1>{% if sub %}<p class="sub">{{ sub }}</p>{% endif %}</div>
  <div class="cab-fotobox" aria-hidden="true"></div>
</div>
{%- endmacro %}
